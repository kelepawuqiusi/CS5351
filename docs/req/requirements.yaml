- id: REQ-TA-NFR-REPRO-001
  title: Immutable run record and report
  type: quality_reproducibility
  priority: Should
  status: partial
  statement: "Every run that returns a logical result and successfully publishes its artifacts, including\
    \ each rerun, shall write exactly one run record and one report folder, both named by a unique `run_id`.\
    \ The record contains: start and end time, code version, every configuration key that can change what\
    \ the run produces, a hash of the prompt templates, and the RUN-001 fields. A later run shall never\
    \ overwrite or change an earlier run's record or report.\n\n**Conditional fields.** Which RUN-001\
    \ fields are present and which may be null is determined by RUN-001's validity table, not by a blanket\
    \ non-null rule: an incomplete run has no rating, and a completed run has no stop reason. A record\
    \ is non-conforming if it carries a null field that its own validity-table row requires to be present,\
    \ or invents a value to fill one.\n\n**Persistence failure.** If a critical artifact (the report or\
    \ the manifest) fails during staging or commit, the run shall not report that the artifact was written.\
    \ That case is governed by the persistence-failure rule of architecture `INV-14` (not yet registered\
    \ as a `REQ-TA-*` entry; see this entry's note); this requirement does not promise a record or report\
    \ in a state where the artifact could not be published, and does not count such a run as a silent\
    \ success."
  fit_criterion: Given the offline profile, when (a) two runs of the same ticker and *D* execute one after
    the other, then 2 distinct records and 2 distinct report folders exist, and the first run's files
    are byte-identical before and after the second; (b) every record carries non-null `run_id`, `started_at`,
    `ended_at`, `version`, `prompt_hash` and `config`, and its RUN-001 fields are checked against the
    validity table rather than for blanket non-nullness — 0 completed records carry a stop reason, 0 incomplete
    records carry a rating, and 0 records omit a field their validity-table row requires (each such instance
    is 1 blocking finding); (c) for each of the 10 keys v0.7.1 leaves out of `run_settings()` (`temperature`,
    `max_tokens`, `max_tool_rounds`, `news_article_limit`, `global_news_article_limit`, `global_news_lookback_days`,
    `holding_period_days`, `google_thinking_level`, `openai_reasoning_effort`, `anthropic_effort`), changing
    only that key makes the two records' *configuration projections* differ in exactly that key (10/10).
    The projection is the set of recorded configuration keys; per-run identity and timing metadata (`run_id`,
    `started_at`, `ended_at`, `prompt_hash`, outcome) is excluded from the projection and is never required
    to match -- two runs must still carry **distinct** `run_id`s and distinct timestamps (2/2 distinct),
    since unique identity is not relaxed; (d) recorded keys = `DEFAULT_CONFIG` keys minus the excluded
    set (0 missing, 0 extra); (e) editing one prompt template changes `prompt_hash`, and leaving templates
    unchanged keeps it the same; (f) the SEC-002 scan finds 0 planted secrets; (g) with a critical staging/commit
    failure injected before rename, 0 runs report a published record or report, and the outcome is the
    persistence failure of architecture `INV-14`.
  tradeoff: '`results_dir` grows faster; no automatic clean-up is proposed.'
  metric: run-record fields recorded per run; determinism of the record after publication
  threshold: 'Among runs whose record and report were successfully published, 100% carry exactly the fields
    that RUN-001''s validity table requires for that run''s outcome, and no others: an `INCOMPLETE` record
    carries a stop reason and no rating, a `COMPLETED` record carries a rating and no stop reason (`run_id`,
    `started_at`, `ended_at`, `version`, `prompt_hash` and `config` are non-null in every record); 0 records
    invent a value to fill a slot; 0 records change after publication. A run whose critical artifact fails
    during staging or commit is excluded from the denominator and must instead not report the artifact
    as written (the persistence-failure rule); it is never counted as a compliant record.'
  verification: offline profile; hash each run record immediately after publication and again after the
    next run
  dependencies:
  - REQ-TA-RUN-001
  - REQ-TA-SEC-002
  baseline: "Re-verified 2026-11-23 against `Le-kk/CS5351@c0081cb`. The run boundary now records reproducibility\
    \ facts in the run manifest: `run_id`, `code_version`, `source_revision`, `prompt_hash`, `effective_config`,\
    \ `start_ts_utc`/`end_ts_utc` and `fingerprint_sha256` (`runapi/execution.py` `_source_revision`/`_prompt_hash`,\
    \ `runapi/reporting.py`; see a real manifest under `docs/reviews/evidence/live-verification-2026-11-21/`).\
    \ The graph-level `run_settings()` (`graph/trading_graph.py`) remains an allowlist with no run id,\
    \ timing or prompt hash, and the state log is still named `full_states_log_<D>.json`. The baseline\
    \ closes this requirement at the `runapi` boundary, not in the raw graph path.\n\n**Corrected 2026-11-24\
    \ on an independent integration review (I24 07).** Fit (b) previously required the RUN-001 fields\
    \ to be non-null in every record, which cannot hold: RUN-001 makes the stop reason present only for\
    \ incomplete runs and the rating only for completed runs. The statement previously promised a record\
    \ and report for every run with no exception, which contradicts the persistence-failure rule of architecture\
    \ `INV-14`. Both were A's own errors. The v4 baseline text is unchanged because it is a read-only\
    \ recorded artefact; the override is dated here and in change-log.md.\n\n**Corrected again 2026-11-24,\
    \ after PR #20 merged (A's own omission).** The 2026-11-24 correction shown above changed the statement\
    \ and fit (b) but left `threshold` reading 'every listed field non-empty', which is the blanket rule\
    \ the correction removed. A reviewer who read only the threshold would still find the contradiction\
    \ that I24 07 reported. The threshold is restated here in the same terms as the fit. This is a wording\
    \ fix to a field the reviewer flagged. It also restates the same rule in the `note` field, so a reader\
    \ who consults only `note` is not left with the older wording."
  open: Widen the record, add run id, timing and prompt hash, and name files by run id.
  source:
  - kind: team_document
    ref: requirements-draft-v4.md
    sha256: 542f382c6ae7040442c075cfe4c8416025af4872dcb62c5b189154c846cab051
    locator: REQ-TA-NFR-REPRO-001
  - kind: baseline_observation
    ref: Le-kk/CS5351@c0081cb
    locator: baseline statement verified against the team repository
  note: '2026-11-24 (later): `threshold` restated against RUN-001''s validity table. Brian''s point was
    that the acceptance wording requires every result field to be non-null; the fix to the statement and
    fit (b) missed this third copy of the same rule. No count changed.'
