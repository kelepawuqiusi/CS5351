    locator: baseline statement verified against the team repository
- id: REQ-TA-GOV-002
  title: Test plan approved before implementation
  type: governance
  priority: Must
  status: proposed
  statement: "Before implementation begins, the test plan for a changed feature shall carry an attributable\
    \ human approval record covering the approved test scope and the plan revision approved; an implementation\
    \ pull request shall not merge otherwise.\n\n**Record (format confirmed by Member E, 2026-11-23; mechanism\
    \ not yet implemented).** One YAML file per approval under `docs/verification/approvals/`, uniquely\
    \ named where a feature has several approvals or revisions, with superseded evidence preserved. Minimum\
    \ fields: `approver`, `approver_role`, `approved_at` with timezone, `plan_ref`, `plan_sha256`, `scope`\
    \ (the covered requirement or feature IDs), `approval_evidence_ref` (the retained human confirmation)\
    \ and `approval_commit` (the revision holding the approved plan and the record). A GitHub account\
    \ name maps to a named team member. A bot-generated file is never human approval.\n\n**Rules.** The\
    \ approval revision must be an ancestor of the first implementation commit for the declared scope;\
    \ a self-entered timestamp is not sufficient proof, and ancestry is evidence of ordering only, never\
    \ of when coding actually began or of genuine human review. The plan hash is checked against the plan\
    \ at the approved revision. An approval never extends to a materially changed plan or to an unlisted\
    \ feature without renewed approval. No hotfix, single-member or approver-absence exception exists.\
    \ A later passing test run or a CI receipt cannot substitute for a missing prior approval. Historical\
    \ work without evidence is disclosed as an evidence gap, never backdated or retrospectively described\
    \ as prior approval."
  fit_criterion: 'Given an implementation pull request, when its approval check runs, then (a) a valid
    record with all 8 fields, a human evidence reference, a matching `plan_sha256` and a covering `scope`
    whose `approval_commit` is an ancestor of the first implementation commit passes with 0 blocking findings;
    and (b) each of 5 negative fixtures fails with exactly 1 blocking finding: record absent, record incomplete,
    approval commit not an ancestor, plan hash or scope mismatch, and an approval claim with no human
    evidence.'
  tradeoff: The approval record is an extra artefact to maintain and keep attributable before any code
    is written.
  metric: approval records traceable to a commit on the approved history
  threshold: 100% of approval records name the approver, the commit and the artefact version; 100% of
    approved commits are ancestors of the approving branch head
  verification: audit every approval record against the commit graph; attempt a rebased rewrite and confirm
    it is detected
  dependencies: []
  baseline: Not present; this is a process rule, not a product feature.
  open: Team and course decision on the record format.
  source:
  - kind: team_document
    ref: requirements-draft-v4.md
    sha256: 542f382c6ae7040442c075cfe4c8416025af4872dcb62c5b189154c846cab051
    locator: REQ-TA-GOV-002
  - kind: baseline_observation
    ref: Le-kk/CS5351@c0081cb
    locator: baseline statement verified against the team repository
  - kind: team_document
    ref: cs5351-2026-2027-project.pdf
    locator: p10 gate 1
  - kind: team_document
    ref: cs5351-2026-2027-project.pdf
    locator: p6 D1(transcript), p7 D9
  note: 'OQ-3, closed 2026-11-23 on Member E''s reply. The record format v4 left open as ''team and course
    decision'' is now stated. Two corrections to A''s own earlier wording. First, A had proposed switching
    the ordering check from timestamps to commit ancestry; E''s answer is that ancestry is the repository-ordering
    check only and proves neither that coding began later nor that a human approved the tests, and both
    the requirement and the evidence must say so. Second, E proposed replacing this requirement with post-implementation
    CI receipts; E has since checked course page 10 gate 1 and the transcript requirements on pages 6
    and 7, withdrawn that proposal, and will implement this gate. That replacement wording is recorded
    as withdrawn, not adopted. Status is `proposed`, not `implemented`: E states that the mechanism and
    its positive and negative checks are not yet built, and neither this reply nor the course citation
    is the team''s signed adoption record.'
- id: REQ-TA-GOV-003
  title: AI-use log updated before merge
  type: governance
  priority: Must
  status: proposed
  statement: A pull request that changes code or prompts shall be blocked unless the AI-use log has been
    updated for that change. The log records the real tools, models and interventions used; it is not
    a retyped summary. The gate checks that an update exists in the pull request; it does not validate
    the log's format or prose except where a separately agreed rule says so.
  fit_criterion: Given a pull request that changes a file under the governed code or prompt paths, when
    the AI-use log gate runs, then (a) 1 accepted fixture with an updated log passes with 0 findings;
    (b) 1 rejected fixture without an update fails with exactly 1 blocking finding; and (c) a pull request
    that touches only files outside those paths is not blocked, 0 findings.
  dependencies: []
  tradeoff: A mandatory log edit on every code or prompt change adds friction; it is accepted because
    the course names this gate explicitly.
  amended_by: []
  note: 'Added 2026-11-23 on Member E''s E14. Course page 10 gate 6 names it as a blocking gate, and page
    9 lists `.github/workflows/ci.yml` as the D7 blocking-gate pipeline, so it belongs in the registry,
    not only in repository process. Crosswalk: the team''s `SEL-TA-GOV-005` states the same obligation;
    this entry is its `REQ-TA-*` counterpart, not an untracked duplicate, and `SEL-TA-GOV-005` is retired
    as a separate requirement only when the crosswalk is agreed. None of this is implemented: `.github/workflows/ci.yml`
    at `Le-kk/CS5351@c0081cb` has three jobs (tests, smoke-install, lint) and no AI-log or dependency
    gate. E states the update-only policy stays; format and content validation are explicitly not requested.'
  source:
  - kind: team_document
    ref: cs5351-2026-2027-project.pdf
    locator: p10 gate 6, p9 ci.yml
  - kind: team_document
    ref: docs/req/selected-requirements.md
    locator: SEL-TA-GOV-005
- id: REQ-TA-INV-014
  title: Immutable input snapshot
  type: invariant
  priority: Must
  status: proposed
  zero_tolerance: true
  statement: "Once validated input is frozen, later source-file changes or consumer mutations shall not\
    \ change the normalized snapshot or canonical fingerprint used by that run. Execution and provenance\
    \ shall derive from that frozen selection; confirmation authorizes use and does not reload a different\
    \ snapshot. No-portfolio and explicitly empty portfolios remain distinct.\n\n**Naming warning.** `REQ-TA-INV-014`\
    \ is **not** the architecture register's `INV-14`. Architecture `INV-14` is the persistence-failure\
    \ rule, which is still unregistered as a `REQ-TA-*` entry. This entry maps architecture `INV-04` /\
    \ `INV-05` / `INV-05b`.\n\n**Who enforces this.** `PortfolioInputService` freezes the selection; `RunContext`\
    \ / `FrozenSnapshot` keep it immutable and carry the fingerprint; both are named in `enforced_components`.\
    \ **No requirement currently owns portfolio-input freezing**, so `enforced_by` is intentionally absent\
    \ rather than pointed at an unrelated entry. The confirmation transition is a separate gap, recorded\
    \ as open item 16."
  fit_criterion: Given a synthetic portfolio A frozen and confirmed with its full 64-character fingerprint
    and normalized contents recorded, when its source file is altered or replaced and a consumer-facing
    derived object is mutated, then the frozen contents and fingerprint remain identical to the recorded
    values (2/2 intact). Given the same frozen selection, when a run executes with a synthetic engine,
    then model-input construction and the authoritative report and manifest provenance both derive from
    A's frozen snapshot, and 0 authoritative values are taken from model prose. Given portfolio B is selected
    instead, then B's identity is recorded and A's is not (1/1). Given a no-portfolio selection versus
    an explicitly empty supplied portfolio, then the first records null snapshot provenance and the second
    records provided mode with a real fingerprint, and 0 instances are confused (2/2). A single observed
    violation is 1 blocking finding.
  enforced_components:
  - tradingagents/runapi/input_service.py PortfolioInputService
  - tradingagents/runapi/context.py FrozenSnapshot / RunContext
  - tradingagents/runapi/context.py snapshot_fingerprint
  dependencies: []
  tradeoff: A separate entry adds a sixth invariant and a fingerprint comparison to every run's evidence.
    It is accepted because an immutable published report does not cover an input that changes after confirmation,
    and because folding it into the still-unregistered resume rule (architecture `INV-11`) would tie it
    to the unresolved resume design that D has not answered.
  amended_by: []
  note: 'Added 2026-11-23 on Member B''s answer to Q-8c, option (1). B''s reason: input mutation, artifact
    isolation and publication fail differently and have different evidence, so coupling input immutability
    to the resume question would make one property depend on another''s open decision. The statement and
    fit are B''s text. C can reuse the existing FR-003 and FR-006 tests and map any remaining confirmation
    and mutation cases before claiming coverage; this is an explicit machine-readable constraint on an
    existing design, not a new canonicalization algorithm. Relationship to REQ-TA-FR-003 (Should) and
    REQ-TA-NFR-REPRO-001 (Should) is recorded here as prose, not as a dependency edge: a Must entry depending
    on a Should entry is a priority inversion, and the validator rejects the reverse ordering. The coverage
    of this invariant is Must while the requirements it constrains remain Should; that gap is recorded,
    not hidden by a dependency. Not verified: no test currently asserts that a source-file change after
    confirmation leaves the frozen fingerprint intact, and no existing test is claimed here as covering
    it.'
  source:
  - kind: team_document
    ref: docs/architecture/invariants.md
    locator: INV-04, INV-05, INV-05b
  - kind: team_document
    ref: requirements-draft-v4.md
    locator: FR-003, FR-006
- id: REQ-TA-GOV-004
  title: Requirement registry validates against its schema
  type: governance
  priority: Must
  status: proposed
  statement: "The requirement registry shall be validated against the declared schema by a blocking check\
    \ before a governed change merges. The valid registry passes with a zero exit code; invalid or missing\
    \ required fields, a missing file, or a validator execution error produce a non-zero outcome and block\
    \ the change. Schema conformance does not establish semantic adequacy, implementation or human adoption\
    \ of the requirements.\n\n**Naming warning.** `REQ-TA-GOV-004` is **not** the team's `SEL-TA-GOV-004`,\
    \ which is the semantic evaluation gate and is A's `REQ-TA-GOV-001`. This entry is schema validation\
    \ only. The team's `SEL-TA-GOV-002` states the same obligation; this entry is its `REQ-TA-*` counterpart."
  fit_criterion: Given the current `docs/req/requirements.yaml` and its declared `req-schema.json`, when
    the check runs, then it exits 0 and reports 0 errors (1/1). Given 5 negative fixtures - a missing
    required top-level key, an invalid MoSCoW priority value, a missing schema file, a registry file that
    does not parse as YAML, and a validator whose own execution raises - then each produces a non-zero
    exit and exactly 1 named finding (5/5), and the corresponding required CI check blocks the governed
    change. A green schema result accompanied by a failing cross-record check is reported as a failure,
    not a pass.
  dependencies:
  - REQ-TA-GOV-001
  tradeoff: A blocking schema gate rejects every governed change while the schema and registry disagree,
    including changes to unrelated files. That cost is accepted because the course names the machine-readable
    registry and its schema as a D1 deliverable and the validation as a blocking gate.
  amended_by: []
  note: 'Added 2026-11-23. Member B stated the position plainly: the obligation must be explicitly represented
    by a machine-readable governance requirement with its own fit and trace links, and a CI implementation
    alone is insufficient. A had previously left this as OQ-12 because adding it on one person''s objection
    repeated an earlier mistake; B''s answer removes that objection by asserting the obligation rather
    than a personal preference. The ID is GOV-004 because 001-003 are used and numbering must not skip;
    it is NOT the team''s GOV-004. Neither the gate nor the schema job exists: at 916d8a6, no job in .github/workflows/
    reads docs/req/, so a green CI run says nothing about whether the registry validates. B did not confirm
    any total count.'
  source:
  - kind: team_document
    ref: cs5351-2026-2027-project.pdf
    locator: p5 D1, p10 gate 3
  - kind: team_document
    ref: docs/req/selected-requirements.md
    locator: SEL-TA-GOV-002
  - kind: team_document
    ref: docs/req/validate.py
    locator: validating command
