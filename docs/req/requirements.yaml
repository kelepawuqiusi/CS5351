- id: REQ-TA-NFR-COST-001
  title: Run token budget
  type: cost
  priority: Should
  status: proposed
  statement: "A run shall use at most `TOKEN_BUDGET` tokens in total, counted from provider usage data.\
    \ A run that would exceed it ends `INCOMPLETE(BUDGET)`. If a provider returns no usage data, the run\
    \ is not stopped; its record marks token usage as `UNKNOWN`.\n\n**Measurement comparability.** `TOKEN_BUDGET`\
    \ shall be set only from measurements that hold the following constant across the baseline and the\
    \ candidate: the entry point used (`run_analysis_api`, CLI, `run_transient` or `propagate` — these\
    \ are not interchangeable), the analyst set, the debate round counts, the ticker and analysis date,\
    \ the model and provider, and the state of the memory log (a run with past-decision context and a\
    \ run without it do not measure the same thing). The one exception is the experimental factor of a\
    \ controlled comparison, which is named and evaluated below. The record of a measurement shall state\
    \ each of these six settings so that a later reader can tell whether two figures are comparable.\n\
    \n**Total, not per call.** The budget counts input **and** output tokens cumulatively across every\
    \ model call in one run: tool-selection calls, analyst calls, both debates, structured-output re-requests,\
    \ free-text fallback and retries whose usage the provider reports. It is not a per-call ceiling and\
    \ not an input-only figure; `max_tokens` in `default_config.py` caps a single call and is not this\
    \ budget.\n\n**Reserve before dispatch.** Before an attempt is dispatched the system shall test the\
    \ remaining budget against the attempt's input plus its maximum permitted output, and shall not dispatch\
    \ an attempt that cannot fit. Counting usage only after a call returns does not satisfy this clause,\
    \ because concurrent branches, retries and output allowance all spend budget between the check and\
    \ the arrival of the usage report.\n\n**Usage availability.** Missing usage metadata shall not be\
    \ read as zero usage. Where a failed or interrupted attempt leaves consumption unknown, the record\
    \ shall mark that usage `UNKNOWN` and the attempt's reservation shall be retained when deciding whether\
    \ further attempts are permitted. The existing rule that an `UNKNOWN` run is not stopped is unchanged;\
    \ what is added is that `UNKNOWN` spends budget rather than being free.\n\n**Scope of the budget.**\
    \ `TOKEN_BUDGET` binds the reference configuration. Extending it to every ticker, date, analyst set\
    \ and portfolio mode is a product decision that accepts more runs stopping early, and it requires\
    \ a correspondingly wider test population; this entry asserts the narrower scope and does not claim\
    \ the wider one.\n\n**Three purposes, kept apart.** An earlier version of this entry concluded that\
    \ a budget whose baseline is the optimised build cannot detect a regression. That conclusion was wrong\
    \ and is withdrawn here: an accepted optimised build can serve as a reference, and whether a cap detects\
    \ a particular increase depends on its margin, not on which build supplied the figure. A loose cap\
    \ misses regressions under either baseline. The three purposes are therefore stated separately.\n\n\
    (1) **Optimization evidence** compares a controlled legacy/candidate pair to estimate the effect of\
    \ the explicit optimisation change. Code, prompts or concise mode are deliberately different across\
    \ the pair; that is the experimental factor, and it is named and frozen at everything else.\n\n(2)\
    \ **Runtime budget calibration** chooses a cap and a stated margin for the named supported reference\
    \ profile, from representative measurements plus quality and completion checks. An optimised reference\
    \ is not inherently invalid here.\n\n(3) **Regression evaluation** compares subsequent builds with\
    \ a named accepted reference and a defined tolerance under a defined profile. The reference is named,\
    \ not assumed identical.\n\n**Comparability.** Two runs are comparable when every setting except the\
    \ one named experimental factor is identical. Requiring the candidate and baseline to be identical\
    \ in the very behaviour under evaluation is a defect, not a safeguard: a controlled optimisation intends\
    \ to change it. The rule that remains is that the factor is named and everything else is frozen. Per-run\
    \ identity and timing metadata (`run_id`, start and end times, timestamps) are recorded, not treated\
    \ as settings, and are excluded from any configuration comparison. `TOKEN_BUDGET` shall be set from\
    \ a named reference configuration and a stated margin, with both numbers recorded; it shall not be\
    \ derived from figures taken under different, unnamed configurations."
  fit_criterion: Given the live profile, when 20 runs execute one after another, then 20/20 have known
    usage ≤ `TOKEN_BUDGET`, and the GOV-001 score over these runs is ≥ `QUALITY_THRESHOLD`. A run with
    `UNKNOWN` usage counts as a failure of this criterion, not as zero cost. Given any two measurements
    offered as a before/after comparison, then the record of each states all six comparability settings
    and 0 comparisons are accepted where a setting differs without being named as a changed factor (1
    such comparison = 1 blocking finding). Given the offline profile and a scripted model, when (a) a
    workflow fits the remaining budget, then it completes and its recorded total equals the sum of the
    scripted per-call usage (0 runs with an unreported call summed as zero); (b) an attempt whose input
    plus maximum output exceeds the remaining budget, then 0 such attempts are dispatched and the run
    ends `INCOMPLETE` with `stop_reason = BUDGET`, no rating and `output_check = NOT_RUN`; (c) 4 concurrent
    branches contend for a remaining budget sufficient for one, then exactly 1 is dispatched and 3 are
    refused, and the recorded total never exceeds `TOKEN_BUDGET`; (d) a call returns no usage metadata,
    then its usage is recorded `UNKNOWN`, its reservation is not returned to the pool, and 0 runs treat
    it as zero; (e) a structured-output re-request and a free-text fallback each consume budget like any
    other attempt. Any run exceeding `TOKEN_BUDGET` is 1 blocking finding.
  tradeoff: 'A budget forces shorter prompts or debates, which the quality threshold partly forbids, and
    a budget tight enough to bind stops analyses before completion. Reserving input plus maximum output
    before dispatch makes the bound checkable, but it refuses attempts that would in practice have used
    less than their allowance, so the effective ceiling is lower than the token figure suggests. The budget
    does not guarantee answer quality and does not fix a monetary cost. A provisional figure derived for
    the unoptimised baseline was 152,000 tokens. **Corrected 2026-11-24:** this line previously called
    it ''about 90% of a single unoptimised control, 160,826'' and described it as a baseline plus an allowance.
    Both were wrong. 152,000 is **94.51%** of 160,826, and 90% of that control is 144,743.4; and a figure
    *below* the single control is not a baseline plus an allowance under any reading. The figure is retained
    only as A''s unverified derivation from one run: it is not a measurement, it is not calibrated, and
    it is not applied. One optimised run already measured 110,725, so no figure here can stand for a configuration
    other than the one it was derived in.'
  metric: cumulative provider-reported input and output tokens per run, against TOKEN_BUDGET, under the
    reference configuration
  threshold: total input+output tokens per run <= TOKEN_BUDGET under the reference configuration, with
    the baseline, the allowance and the six settings all named in the record; 0 runs exceeding the budget;
    0 attempts dispatched without a reservation covering input plus maximum output; 0 `UNKNOWN` usages
    counted as zero; a run that exhausts the budget ends INCOMPLETE with stop_reason BUDGET
  verification: offline profile with a scripted model reporting per-call usage; one within-budget fixture,
    one exhaustion fixture, one 4-way concurrency fixture against the real reservation component, one
    missing-usage fixture, and one fixture each for structured-output re-request and free-text fallback;
    the live before/after pair that fixes `TOKEN_BUDGET` is recorded separately and is not part of the
    offline suite
  dependencies:
  - REQ-TA-GOV-001
  - REQ-TA-NFR-REPRO-001
  baseline: '`max_tokens` caps each call (`default_config.py`). There is no run-level count.'
  open: 'Add up usage per run; set `TOKEN_BUDGET` from a before/after pair under the reference configuration.
    Not yet shown: that the system can enforce the bound (concurrency, retries, output reservation), and
    that any figure below 120,000 reproduces on a clean checkout from the repository rather than a local
    harness. A candidate figure of 120,000 is proposed and recorded in TOKEN_BUDGET''s value text; it
    is not applied.'
  source:
  - kind: team_document
    ref: requirements-draft-v4.md
    sha256: 542f382c6ae7040442c075cfe4c8416025af4872dcb62c5b189154c846cab051
    locator: REQ-TA-NFR-COST-001
  - kind: baseline_observation
    ref: Le-kk/CS5351@c0081cb
    locator: baseline statement verified against the team repository
  note: "Added 2026-11-24 after an integration review of two measurement series (I24 05). The earlier\
    \ series reported total tokens rising ~6.8% over 138,897, measured through `propagate()`; the later\
    \ series reported a ~24.8% fall to 104,459, measured through `run_transient()` with `memory_log_path`\
    \ pinned to an empty file. `propagate()` and `run_transient()` share one code path and differ only\
    \ in a `persist` flag, so the entry point alone does not change token use; but `persist=True` writes\
    \ a decision to the memory log, and the memory log supplies `past_context` to the Portfolio Manager\
    \ prompt (`graph/trading_graph.py` reading it, `agents/managers/portfolio_manager.py` consuming it).\
    \ A run with a populated memory log therefore sends the Portfolio Manager more input than a run with\
    \ an empty one. Neither series is claimed here as wrong, and this entry does not assert which figure\
    \ is closer to the truth. It asserts only that a budget must not be derived from incomparable figures.\n\
    \n**2026-11-24 (later): a candidate figure was offered and A did not adopt it as a number.** Member\
    \ E proposed 120,000 tokens per run from three measurements, 99,532 / 103,120 / 110,725 (highest +\
    \ 8.4%), and offered a reference configuration. A checked the provenance in E's own AI log before\
    \ writing anything. Every one of the three figures is an **optimised** run: the optimisation E authored\
    \ is the change merged as PR #18, and it is already in `main`. The second control, 160,826, is a single\
    \ **unoptimised** run taken in the same session; the first baseline was two runs averaging 138,897.\
    \ So the series covers one configuration and the proposed 'reference configuration' names the optimisation\
    \ as on. **A did not set `TOKEN_BUDGET` to 120,000 for two reasons, both stated rather than implied:**\
    \ (1) three observations do not establish a hard runtime bound, and the figure has no stated margin:\
    \ 120,000 is 8.38% above the highest of the three (110,725), and nothing in the record shows what\
    \ that margin must cover across the retries, concurrency and output allowance this entry requires.\
    \ An earlier version gave a different reason here -- that an optimised baseline 'cannot detect a regression'\
    \ -- and that reason was wrong; see the three purposes above. (2) The three figures and their raw\
    \ per-run artifacts are not in the repository, so A could not check the per-run settings, the quality\
    \ outcome or the completion of each run. **What A did adopt, because it needs no number:** the total-not-per-call\
    \ definition; reserve-before-dispatch; the `INCOMPLETE`/`BUDGET` contract; and that missing usage\
    \ is `UNKNOWN` and spends budget. **The entry point is also misnamed if the reference configuration\
    \ keeps the optimisation on:** `run_transient()` is the entry point only in its `persist=False` form\
    \ with no run API around it, and it is not the path the optimised runs used if they passed through\
    \ the run API. A records the budget as **proposed, not enforced, not validated**, and will not write\
    \ a number until a before/after pair exists under one named configuration. A provisional figure for\
    \ the **unoptimised** baseline is recorded in the tradeoff line so that a later reader has one; it\
    \ is A's derivation, not a measurement, and it is not applied.\n\n**Naming, checked in the repository\
    \ rather than assumed.** `tests/member_d_verification/token_input_benchmark.py` in `main` calls `graph.run_transient('NVDA',\
    \ '2026-01-09')` inside a `patch(...create_tier_client...)` block, over the four analysts market/news/social/fundamentals,\
    \ with `memory_log_path` pinned to `empty-memory.md`. **Corrected 2026-11-24:** an earlier version\
    \ of this note called that harness *scripted and unoptimised* and said it stubs the tier client. That\
    \ was wrong on all three counts. The harness is **live-capable and optimized by default**: `--live`\
    \ is mandatory (lines 17-24), `concise_intermediate_reports=not args.legacy` makes the optimized mode\
    \ the default and `--legacy` the paired control (line 39), and the wrapper installed by `patch` sets\
    \ only `timeout=60` before calling the **real** `create_tier_client` (lines 82-84). It also builds\
    \ the real graph and calls `graph.run_transient` directly (lines 107-109) rather than routing through\
    \ `run_analysis_api`, and git records it as introduced in `aa3b02d`, the same commit as the optimisation,\
    \ not before it. The separate `test_token_input_reduction.py` is the mocked offline test; it is a\
    \ different file. Two facts follow. (1) The harness is **not evidence of an offline budget mechanism**:\
    \ it implements no token-admission controller, so it cannot show that a cap is enforced. (2) Its default\
    \ configuration has the optimisation **on**, which matches the proposed reference configuration. Since\
    \ the harness is live-capable, the missing artifact is the **raw per-run output and configuration**\
    \ of the three runs, not a live path. Until those are uploaded and checked, the three totals stay\
    \ **E-reported**; missing evidence is a limitation this entry states, not a reason to characterise\
    \ the source. **TOKEN_BUDGET remains unset.**"
- id: REQ-TA-NFR-COST-002
  title: Run-wide LLM call cap
  type: cost
  priority: Must
  status: proposed
  statement: 'The system shall ensure that, per run, the number of model-request dispatch attempts never
    exceeds the number of successful reservations and never exceeds `CALL_CAP`: `dispatch_attempts <=
    successful_reservations <= CALL_CAP`. A dispatch attempt is one model-generation request attempt issued
    through the controlled application client boundary, including attempts that time out or fail, application
    retries, structured-output re-requests, free-text fallback, and in-run memory reflection requests.
    Every attempt shall be preceded by its own fresh single-use reservation from the run''s shared budget
    controller; a reservation authorizes exactly one attempt, cannot be reused, and a denied reservation
    dispatches nothing. An attempt that has been issued consumes its slot even if it fails. A workflow
    that finishes within its cap completes normally; a run stops `INCOMPLETE(BUDGET)` only when a required
    further attempt is refused.'
  fit_criterion: Given the offline profile and `CALL_CAP = 8`, when a run executes, then (a) every controlled
    request attempt has a unique preceding successful reservation from the same run; audit records pair
    one reservation with at most one attempt, including retries, fallback and memory calls; a denied reservation
    dispatches nothing; (b) total controlled request attempts ≤ 8 across all branches and model tiers,
    with SDK automatic retries disabled for this mode or every underlying attempt independently gated
    and counted; (c) after 7 slots are consumed, 4 workers contend for the remaining slot using an injected
    barrier against the real reservation component, and exactly 1 succeeds and 3 are denied (the winner's
    identity need not be deterministic); (d) in a scripted workflow that requires one more attempt after
    the cap is exhausted, that attempt is refused and the run returns `INCOMPLETE` with `stop_reason =
    BUDGET`, no final rating and `output_check = NOT_RUN`, with audit metadata naming the configured cap
    and the counts; a workflow that completes within its cap ends normally.
  tradeoff: A small shared cap can starve parallel branches, and a strict single-use reservation means
    a branch that loses the last slot stops the run rather than degrading. The stricter the bound, the
    less tolerant the system is of a borderline cap; that is the price of a guarantee that can actually
    be checked.
  metric: model-request dispatch attempts per run, against successful reservations and CALL_CAP
  threshold: dispatch_attempts <= successful_reservations <= CALL_CAP (test value 8); 0 attempts issued
    without a reservation
  verification: offline profile; one budget-controller fixture with an injected threading barrier for
    the last-slot race; audit log pairing reservations with attempts; one exhaustion fixture and one within-cap
    fixture
  dependencies:
  - REQ-TA-NFR-001
  - REQ-TA-RUN-001
  baseline: 'Only per-scope limits: `max_tool_rounds` (20), `max_debate_rounds` / `max_risk_discuss_rounds`
    (1 each), `llm_max_retries`.'
  open: Add a shared run-scoped counter and a reservation that precedes dispatch.
  note: 'Decision D-3, revised 2026-11-23 after Member B''s technical reply. Non-normative. Application
    counting equals real provider calls only when every attempt the application issues is an attempt the
    provider sees. In the inspected baseline, `llm_max_retries` is forwarded to the provider SDK (`tradingagents/llm_clients/factory.py`),
    and analysts fan out concurrently from `START` (`tradingagents/graph/setup.py`), so a counter around
    high-level model invocations cannot by itself guarantee the bound. Member B''s recommended mechanism
    is one shared run-scoped budget controller with SDK retries disabled, where each application retry
    takes a fresh single-use reservation; that makes the strict `<= CALL_CAP` bound achievable. How it
    is built remains a B design and D implementation decision (`decision-request-D3-cost002-2026-11-22.md`,
    reply of 2026-11-22). Because a reservation authorizes exactly one attempt, concurrent branches hold
    their own reservations and no branch allowance is needed; the earlier `CALL_CAP + N_concurrent_branches`
    form is withdrawn. This requirement does not guarantee the provider gateway''s internal retry count,
    exact billable usage or monetary cost, and it does not claim the bound is implemented: the controller
    does not exist in the baseline. If D cannot make (a)-(d) hold on every enabled client, A downgrades
    COST-002 from Must to Should and restates it as detection-only, recorded in D-4.'
  source:
  - kind: team_document
    ref: requirements-draft-v4.md
    sha256: 542f382c6ae7040442c075cfe4c8416025af4872dcb62c5b189154c846cab051
    locator: REQ-TA-NFR-COST-002
  - kind: team_decision
    ref: req-final-scope-A-2026-11-22.md#3
    locator: D-3
  - kind: team_document
    ref: reply-to-A-cost002-2026-11-22.md
    locator: Member B technical reply; strict bound and single-use reservation adopted 2026-11-23
  - kind: baseline_observation
    ref: Le-kk/CS5351@c0081cb
    locator: baseline statement verified against the team repository
