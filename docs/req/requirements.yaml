  source_sha256: 542f382c6ae7040442c075cfe4c8416025af4872dcb62c5b189154c846cab051
  baseline_document: requirements-draft-v3.md
  baseline_sha256: 8f9dc1f193a75660f57ec210579018edee0ca6b7f876fe786a7c5c9c94923335
  note: 'Requirement text is carried from requirements-draft-v4.md, which is requirements-draft-v3.md
    with D-1, D-2 and the revised D-3 applied. Eight invariant entries (INV-001..008) are promoted from
    ARCH-002''s R1-R8 rules table (A-10), because CS5351 D1 requires `type: invariant`. Non-functional
    entries carry structured metric/threshold/verification fields (A-11), as CS5351 D1 requires. Nothing
    here claims a requirement is implemented or that the team has adopted this set. Two corrections of
    2026-11-23, both from Member B''s reply: (1) `R1`-`R8` here is always the output-check rule set of
    requirements-draft-v4.md, never the team''s runtime-policy triggers, which reuse the same `R` prefix;
    the checker in `tradingagents/runapi/checks.py` emits only `Q1`-`Q4`. (2) Rules R4-R8 rest on coverage,
    sentiment and intermediate-output fields that this requirement set defines and the current checker
    does not inspect, and R2 has no enforcing component, so the table states what a compliant system must
    do, not what the baseline does.'
scope:
  statement: "Research-only. The system produces research and a rating about an instrument. It places\
    \ no orders and does not check exposure against an account.\n\n**Portfolio input is in scope, on one\
    \ consistent basis.** The system accepts an optional user-supplied portfolio snapshot. A run without\
    \ one and a run with one are both in scope and are both required to behave correctly; a supplied snapshot\
    \ enters the run only after explicit confirmation. The requirement set currently has **no active entry\
    \ that owns the confirmation flow itself**: `REQ-TA-FR-001` (evidence IDs and visible source dates),\
    \ `REQ-TA-FR-005` (data gaps and the core-data rule) and `REQ-TA-INV-014` (frozen selection and fingerprint)\
    \ state obligations on the supplied snapshot, and `REQ-TA-INV-014` requires that confirmation authorizes\
    \ the frozen selection rather than reloading a different one, but no entry defines the confirm/decline/EOF\
    \ prompts or the event they emit. That gap is recorded as open item 16 rather than covered by citing\
    \ an ID for a different obligation. `REQ-TA-FR-002` is a **withdrawn** GUI entry and is not the consent\
    \ requirement. Fixture profiles `A-A`, `A-B` and `A-C` in Appendix A exist precisely so that each\
    \ obligation is exercised under the input it needs: nothing here claims that every fixture runs without\
    \ a portfolio.\n\n**What remains outside scope:** account ownership is never assumed, holdings are\
    \ treated as unverified user input, and no requirement here validates position size or exposure. v0.7.1's\
    \ `TraderProposal.position_sizing` field is a model suggestion carried in the report; it is not a\
    \ validated or checked size, and no requirement asserts it is correct. Whether a conditional sizing\
    \ suggestion should be permitted at all is open item 15."
  prd_narrative: 'This single YAML serves as both the machine-readable PRD and the consolidated requirements
    registry. Basis: the CS5351 project PDF p.5 asks for a machine-readable product requirements document
    and a consolidated requirements registry, both in YAML, under ./docs/req/, and p.9 lists exactly one
    YAML there, docs/req/requirements.yaml, labelled machine-readable PRD (D1). No second PRD YAML is
    required. Question closed 2026-11-22 on this evidence; see requirement-source-notes.md OQ-1.'
  withdrawn_ids:
  - id: REQ-TA-FR-002
    reason: GUI out of scope; a GUI is a feature, not a quality attribute. The v0.7.1 CLI is the only
      input.
  - id: REQ-TA-NFR-SAFETY-001
    reason: 'Research-only scope: no position sizing is validated.'
  - id: REQ-TA-NFR-SAFETY-002
    reason: Research-only scope. Replaced by REQ-TA-FR-007 part 3 (no ownership wording).
