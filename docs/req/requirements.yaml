- id: REQ-TA-NFR-001
  title: Fail safely on external failures
  type: quality_reliability
  priority: Must
  status: partial
  statement: "No vendor or model failure shall crash the process. Data failures follow FR-005. Model failures\
    \ follow this table:\n\n| Model situation | Result |\n|---|---|\n| Structured output is malformed,\
    \ but the v0.7.1 free-text fallback produces usable text | Not a failure; the run continues |\n| The\
    \ final decision text has no readable rating | `COMPLETED`, `rating = REVIEW`, `NEEDS_REVIEW` (rule\
    \ R1) |\n| A model step produces no output after retries and the fallback (timeout, provider or auth\
    \ error) | `INCOMPLETE(MODEL)` |"
  fit_criterion: Given the offline profile and 6 fixtures (2 per table row), when each runs, then 6/6
    get the result in their row and 0/6 raise out of the entry point. Additionally, 0 of the FR-005 fixtures
    raise.
  tradeoff: Some runs that used to crash loudly now end quietly as `INCOMPLETE`; the log (OBS-001) must
    keep the detail.
  metric: fraction of fixtures whose result matches their row in the failure table; escapes from the entry
    point
  threshold: 6/6 fixtures produce the documented result; 0/6 raise out of the entry point; 0 FR-005 fixtures
    raise
  verification: offline profile; 6 scripted fixtures (2 per table row) plus the FR-005 fixture set
  dependencies:
  - REQ-TA-RUN-001
  - REQ-TA-FR-005
  baseline: Malformed structured output already falls back to free text (`agents/structured.py`). An unreadable
    final rating already becomes `REVIEW` (`agents/rating.py`). There is no run-level catch, so a model
