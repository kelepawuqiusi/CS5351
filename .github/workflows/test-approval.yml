name: Test approval

# This workflow is part of the protected baseline. It reads the baseline policy
# and verifier, fetches the pull request as data, and does not execute pull
# request code or install pull request dependencies.
#
# The check stays in progress until the receipt artifact has been stored. Only
# the separate completion workflow revalidates the receipt after this run
# succeeds. This producer never publishes a green approval.
#
# The check name to require later is exactly "test approval". Do not mark it
# required until a GitHub run has shown that name, and not before the team has
# put the intended reviewers on the default branch. A docs-only change reports
# "not applicable". A missing required approval fails.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read

run-name: ${{ github.event_name == 'issue_comment' && format('gate-comment-{0}', github.event.comment.id) || 'test-approval' }}

jobs:
  record-approval:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.action == 'created' || github.event.action == 'edited') &&
      (startsWith(github.event.comment.body, '/approve-tests') ||
       startsWith(github.event.comment.body, '/approve-governance') ||
       startsWith(github.event.comment.body, '/revoke-tests'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mark the check in progress
        id: open
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CHECK_CONTEXT_PATH: ${{ runner.temp }}/test-approval-context.json
        run: python scripts/ci/check_test_approval.py open-check
      - name: Retain the opened check context
        uses: actions/upload-artifact@v4
        with:
          name: test-approval-context
          path: ${{ runner.temp }}/test-approval-context.json
          if-no-files-found: error
      - name: Build the receipt
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/approval.yaml"
          rm -f "$receipt"
          if ! python scripts/ci/check_test_approval.py prepare --output "$receipt"; then
            python scripts/ci/check_test_approval.py prepare --post --output "$receipt" || true
            echo "archive=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ ! -f "$receipt" ]; then
            echo "archive=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "archive=true" >> "$GITHUB_OUTPUT"
      - name: Save the receipt
        if: steps.prepare.outputs.archive == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-approval-${{ github.event.comment.id }}
          path: ${{ runner.temp }}/approval.yaml
      - name: Post the receipt comment
        if: steps.prepare.outputs.archive == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/ci/check_test_approval.py prepare --post --output "$RUNNER_TEMP/approval.yaml"
      - name: Validate the saved receipt without publishing success
        if: success()
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          RECEIPT_PATH: ${{ runner.temp }}/approval.yaml
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py finalize
      - name: Report failure or cancellation
        if: ${{ failure() || cancelled() }}
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py publish-failure --message "the test-approval workflow did not finish successfully"

  recheck-comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.action == 'deleted' ||
       (github.event.action == 'edited' &&
        !startsWith(github.event.comment.body, '/approve-tests') &&
        !startsWith(github.event.comment.body, '/approve-governance') &&
        !startsWith(github.event.comment.body, '/revoke-tests')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mark the check in progress
        id: open
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py open-check
      - name: Recheck after the comment changed
        id: check
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py check --publish
      - name: Report failure or cancellation
        if: ${{ failure() || cancelled() }}
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py publish-failure --message "the test-approval workflow did not finish successfully"

  test-approval:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Mark the check in progress
        id: open
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py open-check
      - name: Self-test the baseline verifier
        id: self
        run: python scripts/ci/check_test_approval.py --self-test
      - name: Check this pull request head
        id: check
        if: steps.self.outcome == 'success'
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py check --publish
      - name: Report failure or cancellation
        if: ${{ failure() || cancelled() }}
        env:
          CHECK_RUN_ID: ${{ steps.open.outputs.check_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ steps.self.outcome }}" = "failure" ]; then
            message="the baseline verifier self-test failed"
          elif [ "${{ cancelled() }}" = "true" ]; then
            message="the test-approval workflow was cancelled"
          else
            message="the test-approval workflow did not finish successfully"
          fi
          python scripts/ci/check_test_approval.py publish-failure --message "$message"
