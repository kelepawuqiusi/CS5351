name: Complete test approval

# Only trusted baseline code runs here. Producer artifacts are parsed as data,
# never executed. A receipt from an incomplete/failed run cannot release a PR.
on:
  workflow_run:
    workflows: ["Test approval"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write

jobs:
  complete-approval:
    if: github.event.workflow_run.event == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Revalidate the completed producer and current PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/ci/check_test_approval.py complete-run
